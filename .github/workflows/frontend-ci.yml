name: Frontend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm install

    - name: Run Lint
      run: |
        cd frontend
        npm run lint

    - name: Build
      run: |
        cd frontend
        npm run build
      env:
        NEXT_PUBLIC_API_URL: https://api.showbook.example.com

    - name: Run Component Tests
      run: |
        cd frontend
        # npm test (assuming Jest is set up)

    - name: Run E2E Tests
      run: |
        cd frontend
        # npx playwright test (assuming Playwright is set up)
