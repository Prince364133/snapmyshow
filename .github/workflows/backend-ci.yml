name: Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.0
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package.json

    - name: Install Dependencies
      run: |
        cd backend
        npm install

    - name: Run Lint
      run: |
        cd backend
        # npm run lint (assuming lint script exists)

    - name: Run Tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        JWT_SECRET: test_secret
        REDIS_URL: redis://localhost:6379
        MONGO_URI: mongodb://localhost:27017/showbook_test
        SMTP_USER: test@example.com
        SMTP_PASS: test_pass
